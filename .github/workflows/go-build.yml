name: Go CLI

# The CLI uses only the standard library (ADR-0009), so builds need no module downloads.

on:
  push:
    branches: [main]
    paths: ["apps/cli/**", ".github/workflows/go-build.yml"]
  pull_request:
    paths: ["apps/cli/**", ".github/workflows/go-build.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: apps/cli/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -coverprofile=coverage.out ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: apps/cli
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  cross-platform-build:
    name: Cross-platform build
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: apps/cli
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: apps/cli/go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/joyrana/enterprise-api-copilot/apps/cli/internal/cli.version=${GITHUB_REF_NAME} -X github.com/joyrana/enterprise-api-copilot/apps/cli/internal/cli.commit=${GITHUB_SHA}" \
            -o dist/copilot-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/copilot
