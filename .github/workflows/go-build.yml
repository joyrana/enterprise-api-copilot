name: Go Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - '.github/workflows/go-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/cli/**'

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: apps/cli

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/cli/coverage.out
          flags: cli

  cross-platform-build:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: apps/cli
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/copilot-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/copilot
