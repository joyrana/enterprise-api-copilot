name: Java Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/java-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify formatting (Spotless)
        run: mvn -B spotless:check --no-transfer-progress

      - name: Run Checkstyle
        run: mvn -B checkstyle:check --no-transfer-progress

      - name: Build and run tests
        run: mvn -B verify --no-transfer-progress

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Java Tests
          path: apps/backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/target/site/jacoco/jacoco.xml
          flags: backend

      - name: OWASP Dependency Check
        run: mvn -B dependency-check:check --no-transfer-progress
        continue-on-error: true
