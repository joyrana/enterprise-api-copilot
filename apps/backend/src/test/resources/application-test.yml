spring:
  datasource:
    url: jdbc:h2:mem:copilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    enabled: true

copilot:
  auth:
    token-key: test-only-platform-token-key-0123456789abcdef
    dev-token-enabled: true
  agent:
    base-url: http://127.0.0.1:1
    service-key: test-only-service-token-key-0123456789abcdef
  approval:
    key: test-only-approval-key-0123456789abcdef0123

logging:
  level:
    root: WARN
    io.enterprise.copilot: INFO
