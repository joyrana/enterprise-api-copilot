spring:
  application:
    name: copilot-platform-spring

  profiles:
    active: ${APP_ENV:local}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Unknown request fields are a 400, as in the contract (additionalProperties: false).
      fail-on-unknown-properties: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:api_copilot}
    username: ${POSTGRES_USER:api_copilot}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      pool-name: CopilotHikariPool
      maximum-pool-size: 10
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    async:
      request-timeout: 900000 # event streams stay open while a run executes

server:
  port: ${BACKEND_PORT:8081}
  shutdown: graceful
  compression:
    enabled: false # compression would buffer text/event-stream
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

copilot:
  default-environment: ${COPILOT_DEFAULT_ENVIRONMENT:sandbox}
  auth:
    # HS256 key for platform tokens in local mode. Required (>= 32 bytes) unless an OIDC issuer
    # is configured. Never commit a real value.
    token-key: ${COPILOT_PLATFORM_TOKEN_KEY:}
    issuer: copilot-platform
    audience: copilot-platform
    max-ttl-seconds: 3600
    dev-token-enabled: ${COPILOT_DEV_TOKEN_ENABLED:false}
    dev-users: ${COPILOT_DEV_USERS:alice:acme:developer,priya:acme:approver,vic:acme:viewer,root:acme:admin,gina:globex:developer}
    oidc-issuer-uri: ${COPILOT_OIDC_ISSUER_URI:}
  agent:
    base-url: ${COPILOT_AGENT_URL:http://127.0.0.1:8001}
    service-key: ${COPILOT_SERVICE_TOKEN_KEY:}
    service-token-ttl-seconds: 120
    timeout-seconds: 240
  approval:
    key: ${COPILOT_APPROVAL_KEY:}
    ttl-seconds: 600

app:
  cors:
    allowed-origins:
      - ${BACKEND_CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    io.enterprise.copilot: INFO
