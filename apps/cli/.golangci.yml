# golangci-lint v2 configuration (the previous file was v1 format with duplicate keys).
# Not executed in the session that wrote it (no module proxy access); CI runs it.
version: "2"
run:
  timeout: 5m
linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - misspell
    - revive
    - bodyclose
    - errorlint
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable: [gofmt, goimports]
