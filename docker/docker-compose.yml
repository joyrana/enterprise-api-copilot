# Enterprise API Copilot — Local Development Compose
#
# DEVELOPMENT ONLY. Credentials fall back to obviously dev-only values when the matching
# variable is unset; ports bind to 127.0.0.1. Override every secret via .env elsewhere.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f backend
#   docker compose -f docker/docker-compose.yml down -v

name: enterprise-api-copilot

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: copilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-api_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-api_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_copilot -d api_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kept only because the current backend build includes spring-boot-starter-data-redis;
  # ADR-0007 removes it once the backend migration (Phase 3) drops that dependency.
  redis:
    image: redis:7-alpine
    container_name: copilot-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-only-redis-password}"]
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-redis-password}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Backend ─────────────────────────────────────────────────────────────

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: copilot-backend
    image: api-copilot/backend:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-api_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-api_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-only-redis-password}
      # The agent service HTTP adapter is not built yet (Phase 4); see docs/implementation/STATUS.md.
      AGENT_SERVICE_URL: http://agent-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: copilot-frontend
    image: api-copilot/frontend:local
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Observability ───────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: copilot-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:12.1.1
    container_name: copilot-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-only-grafana-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["observability"]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: copilot-network
